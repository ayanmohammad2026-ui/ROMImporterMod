name: Build Geode Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Geode SDK
      uses: geode-sdk/install-geode-cli@v1

    - name: Build the mod
      uses: geode-sdk/build-geode-mod@main
      with:
        target: all
